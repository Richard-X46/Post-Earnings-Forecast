[project]
name = "post-earnings-forecast"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.2.2",
    "boto3>=1.43.0",
    "databricks-connect>=18.0.0",
    "deltalake>=1.6.0",
    "dotenv>=0.9.9",
    "duckdb>=1.5.2",
    "ipython>=9.13.0",
    "lxml>=6.1.0",
    "matplotlib>=3.10.9",
    "modal>=1.5.2",
    "numpy>=2.4.4",
    "openpyxl>=3.1.5",
    "optuna>=4.9.0",
    "pandas>=3.0.3",
    "plotly>=6.7.0",
    "polars>=1.41.0",
    "pyarrow>=24.0.0",
    "pydrive2>=1.21.3",
    "pysentiment2>=0.1.1",
    "pytorch-tabnet>=4.1.0",
    "requests[socks]>=2.34.2",
    "s3fs>=2026.4.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "stem>=1.8.2",
    "ta-lib>=0.6.8",
    "tensorflow>=2.21.0",
    "torch>=2.12.1",
    "xgboost>=3.3.0",
    "yfinance>=1.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter-client>=8.9.1",
    "nbconvert>=7.17.1",
    "nbformat>=5.10.4",
]
