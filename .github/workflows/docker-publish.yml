name: Build and push report image

# Renders the Quarto report, then ships the static HTML as a tiny nginx
# image to GHCR. Rendering in CI keeps the image in sync with src/report.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/report/**"
      - "Dockerfile.report"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.42

      - name: Install render deps
        run: pip install -r src/report/requirements-report.txt

      - name: Render report
        # NOTE: --output-dir must be absolute. A relative path resolves
        # from the document's folder (src/report/), not the repo root.
        run: quarto render src/report/report.qmd --to html --output-dir "$GITHUB_WORKSPACE/src/out"
        env:
          QUARTO_PYTHON: python

      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.report
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
